logger:
  level: debug
  format: json

server:
  host: "0.0.0.0"
  port: 8080
  shutdown_timeout: 20s
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 120s

db:
  host: postgres
  port: 5432
  name: images

s3:
  endpoint: 'https://s3.ru-3.storage.selcloud.ru'
  port: 443
  region: 'ru-3'
  bucket: 'immersive-images'

images:
  default_limit: 10
  max_limit: 100
  default_style: PATCHES
  default_palette: NEON
  default_width: 256
  default_height: 256
  min_width: 64
  max_width: 1024
  min_height: 64
  max_height: 1024
  default_scale: 3
  min_scale: 0.5
  max_scale: 10
