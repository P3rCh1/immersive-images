openapi: 3.1.0
info:
  title: Immersive Images components
  version: 1.0.0
components:
  schemas:
    ImageMeta:
      type: object
      description: |
        Metadata of a stored image, including the resolved generation
        parameters it was rendered with.
      required:
        - uuid
        - name
        - created_at
        - seed
        - settings
      properties:
        uuid:
          type: string
          format: uuid
          description: Stable identifier of the image.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the image.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp in UTC.
        seed:
          type: integer
          description: Seed the image was generated from.
        settings:
          $ref: '#/components/schemas/GenerationSettingsResponse'
          description: Image generation settings
    Geometry:
      type: string
      enum:
        - PATCHES
        - SPOTS
        - RINGS
        - TERRACES
        - WAVES
        - MOTTLED
      description: Image forms.
    Palette:
      type: string
      enum:
        - NEON
        - DARK
        - TOXIC
        - RAINBOW
        - OCEAN
        - LAVA
        - MONO
      description: Image color style.
    Additional:
      type: string
      enum:
        - PIXEL
        - BLUR
      nullable: true
      description: Optional post-processing effect.
    GenerationSettingsRequest:
      type: object
      description: Generation parameters for a create request
      properties:
        style:
          $ref: '#/components/schemas/Geometry'
        palette:
          $ref: '#/components/schemas/Palette'
        additional:
          $ref: '#/components/schemas/Additional'
        width:
          type: integer
          description: Output width in pixels.
        height:
          type: integer
          description: Output height in pixels.
        scale:
          type: number
          format: double
          description: Zoom level of the underlying noise field.
    GenerationSettingsResponse:
      type: object
      description: Image generation parameters
      required:
        - style
        - palette
        - width
        - height
        - scale
      properties:
        style:
          $ref: '#/components/schemas/Geometry'
        palette:
          $ref: '#/components/schemas/Palette'
        additional:
          $ref: '#/components/schemas/Additional'
        width:
          type: integer
          description: Output width in pixels.
        height:
          type: integer
          description: Output height in pixels.
        scale:
          type: number
          format: double
          description: Zoom level of the underlying noise field.
    CreateImageRequest:
      type: object
      required:
        - seed
        - name
      properties:
        seed:
          type: integer
          description: Seed for procedural generation.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the image.
        settings:
          $ref: '#/components/schemas/GenerationSettingsRequest'
          description: Generation settings.
    UpdateImageRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name of the image.
    ListImagesResponse:
      type: object
      required:
        - items
        - total
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageMeta'
        total:
          type: integer
          minimum: 0
          description: Total number of images available.
        limit:
          type: integer
          description: Applied page size.
        next:
          type: string
          format: uuid
          description: Next start.
    Error:
      type: object
      description: Uniform error payload.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: Error description.
  responses:
    BadRequest:
      description: The request is malformed or contains invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The image with the given UUID does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Storage or generation service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
