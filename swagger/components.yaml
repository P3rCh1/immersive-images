openapi: 3.1.0
info:
  title: Immersive Images components
  version: 1.0.0
components:
  schemas:
    ImageMeta:
      type: object
      description: |
        Metadata of a stored image.
      required:
        - uuid
        - name
        - created_at
      properties:
        uuid:
          type: string
          format: uuid
          description: Stable identifier of the image.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the image.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp in UTC.
    CreateImageRequest:
      type: object
      required:
        - seed
        - name
      properties:
        seed:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: |
            Seed for procedural generation.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the image.
    UpdateImageRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New name of the image.
    ListImagesResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageMeta'
        total:
          type: integer
          minimum: 0
          description: Total number of images available.
        limit:
          type: integer
          description: Applied page size.
        offset:
          type: integer
          minimum: 0
          description: Applied offset.
    Error:
      type: object
      description: Uniform error payload.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              description: Error description.
  responses:
    BadRequest:
      description: The request is malformed or contains invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The image with the given UUID does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Storage or generation service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
